<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation Experiment</title>

    <style>
        .box {
            width: 90px;
            height: 100px;
            background: purple;
            border-radius: 50%;
            margin: 100px auto;
            animation: move 3s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(150px);
            }
        }
    </style>
</head>
<body>

    <h2 align="Middle">CSS Animation Experiment</h2>

    <div class="box"></div>

</body>
</html>
