
<!DOCTYPE html>
<html>
<head>
    <title>DARK MODE</title>

    <style>
        body {
            background: white;
            color: black;
            text-align: center;
            font-family: Cambria;
            transition: 0.5s;
        }

        .dark {
            background: #222;
            color: white;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Dark Mode Implementation</h1>

    <p>Welcome to my webpage!</p>

    <button onclick="changeMode()">
        Toggle Dark Mode
    </button>

    <script>
        function changeMode() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
